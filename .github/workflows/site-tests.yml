name: Site tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 08:00 SAST — catches rot in external links/fonts

jobs:
  test:
    name: Playwright + pytest (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run test suite
        run: |
          python -m pytest \
            --html=report/index.html --self-contained-html \
            --junitxml=report/junit.xml \
            --screenshot=only-on-failure \
            --output=report/artifacts

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report/
          retention-days: 14
